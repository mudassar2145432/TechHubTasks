<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherSphere | Interactive Weather Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3f37c9;
      --accent: #4cc9f0;
      --dark: #1a1a2e;
      --light: #f8f9fa;
      --card-bg: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #16213e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .logo i {
      font-size: 2.5rem;
      color: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(to right, var(--accent), var(--light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-weight: 300;
      opacity: 0.8;
      font-size: 1.2rem;
    }

    .search-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      position: relative;
      z-index: 10;
    }

    .city-selector {
      position: relative;
      width: 300px;
    }

    .city-selector select {
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: 50px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: rgb(255, 255, 255);
      font-size: 1rem;
      appearance: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .city-selector select:focus {
      outline: none;
      background: rgb(97, 165, 243);
    }

    .city-selector::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--accent);
    }

    .refresh-btn {
      background: linear-gradient(45deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 0 2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .refresh-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .refresh-btn:active {
      transform: translateY(0);
    }

    .weather-display {
      position: relative;
      min-height: 500px;
    }

    .weather-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      transition: all 0.5s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s forwards 0.3s;
      position: relative;
      overflow: hidden;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .weather-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .location-title {
      font-size: 2.5rem;
      font-weight: 600;
    }

    .current-weather {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .temperature-display {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .main-temp {
      font-size: 5rem;
      font-weight: 300;
      line-height: 1;
      position: relative;
    }

    .main-temp::after {
      content: '°C';
      font-size: 2rem;
      position: absolute;
      top: 0;
      right: -1.5rem;
    }

    .weather-icon {
      font-size: 4rem;
      margin-right: 1rem;
    }

    .weather-desc {
      font-size: 1.5rem;
      font-weight: 400;
      text-transform: capitalize;
    }

    .feels-like {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .detail-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      transform: translateY(0);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .detail-card:nth-child(1) { animation-delay: 0s; }
    .detail-card:nth-child(2) { animation-delay: 0.5s; }
    .detail-card:nth-child(3) { animation-delay: 1s; }
    .detail-card:nth-child(4) { animation-delay: 1.5s; }
    .detail-card:nth-child(5) { animation-delay: 2s; }
    .detail-card:nth-child(6) { animation-delay: 2.5s; }

    .detail-card:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-5px) !important;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .detail-icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    .detail-value {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    .detail-label {
      font-size: 0.9rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .timestamp {
      text-align: right;
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
      }
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      margin-bottom: 1.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .search-container {
        flex-direction: column;
        align-items: center;
      }

      .city-selector {
        width: 100%;
      }

      .refresh-btn {
        width: 100%;
        justify-content: center;
      }

      .current-weather {
        flex-direction: column;
        text-align: center;
      }

      .location-header {
        flex-direction: column;
        gap: 1rem;
      }

      .weather-details {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-cloud-sun-rain"></i>
        <h1>WeatherSphere</h1>
      </div>
      <p class="subtitle">Real-time weather insights with stunning visualizations</p>
    </header>

    <div class="search-container">
      <div class="city-selector">
        <select id="citySelect">
          <option value="">Loading cities...</option>
        </select>
      </div>
      <button class="refresh-btn" id="refreshBtn">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>

    <div class="weather-display" id="weatherDisplay">
      <div class="loading">
        <div class="spinner"></div>
        <p class="loading-text">Fetching weather data...</p>
      </div>
    </div>
  </div>

  <script>
    // Original data fetching logic remains the same
    const apiUrl = "https://e5i971xno6.execute-api.us-east-1.amazonaws.com/prod/GetWeatherData";

    // Create floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = window.innerWidth < 768 ? 30 : 50;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // Random properties
        const size = Math.random() * 5 + 2;
        const posX = Math.random() * window.innerWidth;
        const duration = Math.random() * 20 + 10;
        const delay = Math.random() * 5;
        const opacity = Math.random() * 0.5 + 0.1;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${posX}px`;
        particle.style.bottom = `-10px`;
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${delay}s`;
        particle.style.opacity = opacity;
        
        particlesContainer.appendChild(particle);
      }
    }

    // Enhanced weather icon mapping
    function getWeatherIcon(description) {
      const desc = description.toLowerCase();
      if (desc.includes("clear")) return "<i class='fas fa-sun'></i>";
      if (desc.includes("cloud")) return "<i class='fas fa-cloud'></i>";
      if (desc.includes("rain")) return "<i class='fas fa-cloud-rain'></i>";
      if (desc.includes("storm") || desc.includes("thunder")) return "<i class='fas fa-bolt'></i>";
      if (desc.includes("snow")) return "<i class='far fa-snowflake'></i>";
      if (desc.includes("fog") || desc.includes("mist")) return "<i class='fas fa-smog'></i>";
      return "<i class='fas fa-cloud-sun'></i>";
    }

    // Enhanced feels like icon mapping
    function getFeelsLikeIcon(temp) {
      const tempNum = parseFloat(temp);
      if (tempNum >= 35) return "<i class='fas fa-temperature-high'></i>";
      if (tempNum >= 25) return "<i class='fas fa-thermometer-three-quarters'></i>";
      if (tempNum >= 15) return "<i class='fas fa-thermometer-half'></i>";
      if (tempNum >= 5) return "<i class='fas fa-thermometer-quarter'></i>";
      return "<i class='fas fa-temperature-low'></i>";
    }

    // Dynamic background based on weather
    function setWeatherTheme(description) {
      const body = document.body;
      const desc = description.toLowerCase();
      
      if (desc.includes("clear")) {
        body.style.background = "linear-gradient(-45deg, #4cc9f0, #4361ee, #3a0ca3, #4361ee)";
      } else if (desc.includes("rain")) {
        body.style.background = "linear-gradient(-45deg, #3a0ca3, #4895ef, #4cc9f0, #3a0ca3)";
      } else if (desc.includes("cloud")) {
        body.style.background = "linear-gradient(-45deg, #6c757d, #adb5bd, #dee2e6, #6c757d)";
      } else if (desc.includes("storm") || desc.includes("thunder")) {
        body.style.background = "linear-gradient(-45deg, #240046, #3c096c, #5a189a, #240046)";
      } else if (desc.includes("snow")) {
        body.style.background = "linear-gradient(-45deg, #caf0f8, #90e0ef, #00b4d8, #caf0f8)";
      } else {
        body.style.background = "linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #16213e)";
      }
    }

    async function fetchWeatherData() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Network response was not ok");
        return await response.json();
      } catch (err) {
        console.error("Failed to fetch weather data:", err);
        document.getElementById('weatherDisplay').innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Failed to load weather data. Please try again later.</p>
          </div>
        `;
        return null;
      }
    }

    function populateDropdown(data) {
      const select = document.getElementById("citySelect");
      select.innerHTML = "";
      const cities = [...new Set(data.map(item => item.location))];
      
      cities.forEach(city => {
        const option = document.createElement("option");
        option.value = city;
        option.textContent = city;
        select.appendChild(option);
      });

      select.onchange = () => {
        const cityData = data.find(item => item.location === select.value);
        showWeather(cityData);
      };

      if (cities.length > 0) {
        select.value = cities[0];
        showWeather(data.find(item => item.location === cities[0]));
      }
    }

    function showWeather(item) {
      if (!item) return;
      
      setWeatherTheme(item.description);
      const weatherIcon = getWeatherIcon(item.description);
      const feelsLikeIcon = getFeelsLikeIcon(item.feels_like);
      const container = document.getElementById("weatherDisplay");
      
      container.innerHTML = `
        <div class="weather-card">
          <div class="location-header">
            <h2 class="location-title">${item.location}</h2>
            <div class="weather-desc">${item.description}</div>
          </div>
          
          <div class="current-weather">
            <div class="weather-icon">${weatherIcon}</div>
            <div class="temperature-display">
              <div class="main-temp">${item.temperature}</div>
              <div class="feels-like">
                ${feelsLikeIcon} Feels like ${item.feels_like}°C
              </div>
            </div>
          </div>
          
          <div class="weather-details">
            <div class="detail-card">
              <div class="detail-icon"><i class="fas fa-tachometer-alt"></i></div>
              <div class="detail-value">${item.pressure} hPa</div>
              <div class="detail-label">Pressure</div>
            </div>
            
            <div class="detail-card">
              <div class="detail-icon"><i class="fas fa-wind"></i></div>
              <div class="detail-value">${item.wind_speed} m/s</div>
              <div class="detail-label">Wind Speed</div>
            </div>
            
            <div class="detail-card">
              <div class="detail-icon"><i class="fas fa-cloud"></i></div>
              <div class="detail-value">${item.clouds}%</div>
              <div class="detail-label">Cloud Coverage</div>
            </div>
            
            <div class="detail-card">
              <div class="detail-icon"><i class="fas fa-eye"></i></div>
              <div class="detail-value">${item.visibility} m</div>
              <div class="detail-label">Visibility</div>
            </div>
            
            <div class="detail-card">
              <div class="detail-icon"><i class="fas fa-map-marker-alt"></i></div>
              <div class="detail-value">${item.latitude}, ${item.longitude}</div>
              <div class="detail-label">Coordinates</div>
            </div>
            
            <div class="detail-card">
              <div class="detail-icon"><i class="fas fa-tint"></i></div>
              <div class="detail-value">${item.humidity}%</div>
              <div class="detail-label">Humidity</div>
            </div>
          </div>
          
          <div class="timestamp">Last updated: ${new Date(item.timestamp).toLocaleString()}</div>
        </div>
      `;
    }

    async function fetchAndUpdate() {
      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Refreshing";
      
      try {
        const data = await fetchWeatherData();
        if (!data) return;
        
        const select = document.getElementById("citySelect");
        if (select.options.length === 0 || select.options[0].value === "") {
          populateDropdown(data);
        } else {
          const cityData = data.find(item => item.location === select.value);
          showWeather(cityData);
        }
      } catch (err) {
        console.error("Failed to fetch weather data:", err);
      } finally {
        setTimeout(() => {
          refreshBtn.innerHTML = "<i class='fas fa-sync-alt'></i> Refresh";
        }, 1000);
      }
    }

    // Initialize the dashboard
    document.addEventListener('DOMContentLoaded', () => {
      createParticles();
      fetchAndUpdate();
      
      // Set up refresh button
      document.getElementById('refreshBtn').addEventListener('click', fetchAndUpdate);
      
      // Set up auto-refresh
      setInterval(fetchAndUpdate, 30000);
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      document.getElementById('particles').innerHTML = '';
      createParticles();
    });
  </script>
</body>
</html>
