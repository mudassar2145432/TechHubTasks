<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text to Speech with Amazon Polly</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Amazon Polly Text to Speech</h2>
    <textarea id="textInput" placeholder="Type your text here..."></textarea><br>
    <button onclick="convertText()">Convert to Audio</button>

    <div id="audioSection" style="display: none;">
      <h3>Audio Output</h3>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
