<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mass Email Sender</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #555;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }

    textarea {
      height: 120px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #0056b3;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #007bff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      display: none;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Mass Email Sender</h2>

    <label for="subject">Subject</label>
    <input type="text" id="subject" placeholder="Enter subject..." value="Welcome to Our Service">

    <label for="message">Message</label>
    <textarea id="message"><h1>Hello!</h1><p>This is a mass email.</p></textarea>

    <button id="sendBtn" onclick="sendEmail()">Send Emails</button>
    <div class="loader" id="loader"></div>
    <p id="status"></p>
  </div>

  <script>
    async function sendEmail() {
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;
      const loader = document.getElementById('loader');
      const statusText = document.getElementById('status');
      const sendBtn = document.getElementById('sendBtn');

      // Show loader and disable button
      loader.style.display = 'block';
      statusText.innerText = '';
      sendBtn.disabled = true;

      try {
        const response = await fetch('https://g3k5vw1gx6.execute-api.us-east-1.amazonaws.com/prod/MassEmailSender', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subject, message })
        });

        const data = await response.json();
        statusText.innerText = data.body || "Emails sent!";
        statusText.style.color = 'green';
      } catch (error) {
        console.error(error);
        statusText.innerText = "Error sending emails.";
        statusText.style.color = 'red';
      } finally {
        loader.style.display = 'none';
        sendBtn.disabled = false;
        setTimeout(() => {
          statusText.innerText = '';
          statusText.style.color = 'green';
        }, 5000);
      }
    }
  </script>
</body>
</html>
