<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance</title>
    <style>
        /* Prevent scrolling */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .video-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #007BFF;
            width: 100%;
            max-width: 640px;
            height: 300px;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        #popupModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        #popupContent {
            background: rgba(255, 216, 216, 0.164);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            text-align: center;
            min-width: 300px;
            max-width: 80%;
            font-size: 18px;
            color: #f3f3f3;
            transition: all 0.3s ease-in-out;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>🎓 Face Recognition Attendance</h1>

    <div class="container">
        <div class="video-wrapper">
            <img src="{{ url_for('video_feed') }}" alt="Live Feed">
        </div>

        <button onclick="markAttendance()">📸 Mark Attendance</button>
    </div>

    <!-- Popup Modal -->
    <div id="popupModal">
        <div id="popupContent">
            <div id="processingMessage">⏳ Processing...<br>Please wait.</div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="successSound" src="{{ url_for('static', filename='preview.mp3') }}"></audio>
    <audio id="errorSound" src="{{ url_for('static', filename='error.mp3') }}"></audio>

    <script>
        function markAttendance() {
            const popupModal = document.getElementById("popupModal");
            const processingMessage = document.getElementById("processingMessage");
            const successSound = document.getElementById("successSound");
            const errorSound = document.getElementById("errorSound");

            // Show modal with processing message
            popupModal.style.display = "flex";
            processingMessage.innerHTML = "⏳ Processing...<br>Please wait.";

            fetch('/capture', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    const message = data.message || "✔️ Done.";

                    // Play success or error sound based on message
                    if (message.toLowerCase().includes("already")) {
                        errorSound.play();
                    } else {
                        successSound.play();
                    }

                    // Show the message
                    processingMessage.innerHTML = message;

                    // Hide modal after 4 seconds
                    setTimeout(() => {
                        popupModal.style.display = "none";
                    }, 4000);
                })
                .catch(err => {
                    processingMessage.innerHTML = "❌ Error occurred.";
                    errorSound.play();
                    setTimeout(() => {
                        popupModal.style.display = "none";
                    }, 4000);
                });
        }
    </script>

</body>
</html>
